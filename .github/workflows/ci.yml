name: Native build and safety tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test backend/tests/*.test.mjs
      - run: node scripts/check-public.mjs
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang cmake libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 openssh-client openssh-server
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p sync-core
      - name: Native askpass process integration
        run: node scripts/test-askpass.mjs
      - name: Real OpenSSH transport and agent integration
        if: runner.os == 'Linux'
        run: scripts/test-ssh.sh
      - run: cargo test --locked -p pi-sync-desktop
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release -p pi-sync-desktop
