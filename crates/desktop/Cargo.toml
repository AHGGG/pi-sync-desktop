[package]
name = "pi-sync-desktop"
default-run = "pi-sync-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit = "=0.9.0"
sync-core = { path = "../sync-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
tempfile.workspace = true
directories = "6"
similar = "=2.7.0"


[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }

[features]
render-check = ["gpui-kit/test-support"]

[[bin]]
name = "pi-sync-render-check"
path = "src/render_check.rs"
required-features = ["render-check"]
